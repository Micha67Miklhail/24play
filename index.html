<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locker Terminal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0B0F14;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}.container{width:min(1100px,95vw)}.splash{position:fixed;inset:0;background:linear-gradient(180deg,#0B0F14,#141922);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10000;color:#fff;transition:opacity .4s}.splash.hide{opacity:0;pointer-events:none}.logo{font-size:48px;font-weight:700;color:#29B6F6}.subtitle{margin-top:8px;color:#cbd5e1;font-size:20px}.dots{display:flex;gap:10px;margin-top:26px}.dots span{width:12px;height:12px;border-radius:50%;background:#29B6F6;animation:b 1.2s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}@keyframes b{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{background:#1A202C;border:2px solid #2d3748;color:#fff;border-radius:22px;height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:.2s;user-select:none}.card:hover{transform:scale(1.03);border-color:#29B6F6}.card:active{transform:scale(.98)}.card.pending{background:#30343a;border-color:#4b5563;cursor:not-allowed;transform:none}.card.used{background:#0B0F14;border-color:#1b2530;color:#667085;cursor:not-allowed;transform:none}.num{font-size:64px;font-weight:700;line-height:1}.price{font-size:25px;font-weight:600;color:#cbd5e1;margin-top:16px}.hold{font-size:17px;font-weight:700;color:#fbbf24;margin-top:14px}.usedtxt{font-size:18px;font-weight:700;margin-top:14px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center}.popup{background:#121820;color:#fff;width:420px;max-width:90vw;padding:40px;border-radius:24px;text-align:center}.popup h2{margin:0 0 20px;font-size:42px}.pin{font-size:70px;font-weight:bold;color:#29B6F6;margin:20px 0}button{padding:18px 35px;font-size:22px;border:none;border-radius:14px;background:#29B6F6;border:2px solid #29B6F6;color:#fff;cursor:pointer}#confirmOverlay button{font-size:18px;padding:14px 28px}.loading{position:fixed;inset:0;background:rgba(11,15,20,.96);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:9999}.spinner{width:70px;height:70px;border:8px solid #ddd;border-top:8px solid #29B6F6;border-radius:50%;animation:spin 1s linear infinite}.loading p{font-size:24px;color:#29B6F6;font-weight:bold;margin-top:20px}@keyframes spin{to{transform:rotate(360deg)}}body.busy .card{pointer-events:none;opacity:.6}
.num{font-size:50px}.price{font-size:20px;margin-top:14px}.hold{width:100%;font-size:15px;text-align:center}.usedtxt{font-size:16px}

/* Premium terminal theme */
body{background:radial-gradient(circle at 50% -10%,#193754 0%,#0d1722 36%,#070b10 76%);padding:42px 0}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(41,182,246,.08),transparent 28%,transparent 72%,rgba(94,234,212,.045));}
.container{position:relative;width:min(1040px,92vw)}
.terminalHeader{display:flex;align-items:flex-end;justify-content:space-between;margin:0 4px 28px;padding:0 0 19px;border-bottom:1px solid rgba(148,163,184,.22)}
.brand{font-size:34px;font-weight:800;letter-spacing:-1.4px;color:#f8fafc}.brand span{color:#38bdf8}.brandSub{font-size:13px;letter-spacing:2.3px;text-transform:uppercase;color:#7dd3fc;margin-top:6px}.liveBadge{display:flex;align-items:center;gap:8px;color:#b7c8d8;font-size:13px;letter-spacing:.6px}.liveBadge:before{content:"";width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 14px #34d399}
.grid{gap:18px}.card{height:205px;background:linear-gradient(145deg,rgba(31,44,59,.96),rgba(16,24,34,.98));border:1px solid rgba(148,163,184,.28);border-radius:20px;box-shadow:0 16px 36px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.04)}.card:hover{transform:translateY(-5px);border-color:#38bdf8;box-shadow:0 20px 42px rgba(0,0,0,.35),0 0 0 1px rgba(56,189,248,.2),0 0 30px rgba(14,165,233,.13)}.card:active{transform:translateY(-1px)}.card.pending{background:linear-gradient(145deg,#303841,#202831);border-color:#596571;box-shadow:inset 0 1px rgba(255,255,255,.04)}.card.used{background:rgba(7,11,16,.7);border-color:rgba(71,85,105,.2);box-shadow:none}.num{font-size:52px;letter-spacing:1px;color:#f8fafc}.card.used .num{color:#64748b}.price{font-size:19px;color:#a9c4d9}.hold{color:#fbbf24;letter-spacing:.45px}.usedtxt{color:#64748b;letter-spacing:1.6px}.popup{background:linear-gradient(145deg,#172333,#0e161f);border:1px solid rgba(125,211,252,.25);box-shadow:0 28px 80px rgba(0,0,0,.6);border-radius:28px}.popup h2{color:#f8fafc}.pin{color:#67d5ff;text-shadow:0 0 24px rgba(56,189,248,.38)}#confirmOverlay button{min-width:190px;border-radius:12px;letter-spacing:.8px}.loading{background:rgba(5,9,14,.9);backdrop-filter:blur(10px)}.splash{background:radial-gradient(circle at 50% 30%,#193754,#0a1017 66%)}
/* Layout and availability states */
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{position:relative}.card.used{opacity:.48}.card.pending{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.025) 0 8px,transparent 8px 16px),linear-gradient(145deg,#303841,#202831)}.card.pending:before{content:"🔒";position:absolute;top:14px;right:14px;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(8,13,19,.62);border:1px solid rgba(251,191,36,.38);font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.28)}.card.pending .num,.card.pending .price{opacity:.7}
@media(max-width:680px){body{padding:26px 0}.terminalHeader{margin-bottom:20px}.brand{font-size:29px}.liveBadge{font-size:11px}.grid{grid-template-columns:1fr;gap:12px}.card{height:156px}.num{font-size:40px}.price{font-size:16px}}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="logo">24Play</div><div class="subtitle">Select your locker</div><div class="dots"><span></span><span></span><span></span></div><div style="margin-top:20px;color:#94a3b8">Loading lockers...</div></div>
<div class="container"><div class="terminalHeader"><div><div class="brand">24<span>Play</span></div><div class="brandSub">Smart locker terminal</div></div><div class="liveBadge">System online</div></div><div class="grid" id="grid"></div></div>
<div class="overlay" id="confirmOverlay"><div class="popup"><h2 id="confirmLocker"></h2><p id="confirmPrice" style="font-size:26px;color:#29B6F6;margin:10px 0"></p><p style="font-size:22px;margin:30px 0">Pay to receive an access PIN?</p><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><button id="payButton" onclick="confirmGetPin()">PAY</button><button style="background:#2f3b52;color:#fff;border:2px solid #29B6F6" onclick="closeConfirm()">CANCEL</button></div></div></div>
<div class="loading" id="loadingOverlay"><div class="spinner"></div><p id="loadingText">Loading...</p></div>
<div class="overlay" id="overlay"><div class="popup"><h2 id="popupLocker"></h2><div style="font-size:22px;color:#e5e7eb">PIN</div><div class="pin" id="popupPin"></div><button onclick="closePopup()">Close</button></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbzy_r7S_paEwhcnK_je9ll5hpOU8IJbES4iYkgkBai5cwwK9vs3Ld6BrQ9wz44v40fYYg/exec";
let selectedLocker="",selectedCard=null,selectedPrice="",selectedCurrency="QAR",isLoading=false,refreshInProgress=false;

// Google Apps Script ContentService does not send CORS headers; JSONP avoids that browser restriction.
function apiRequest(params){return new Promise((resolve,reject)=>{const callback="lockerJsonp_"+Date.now()+"_"+Math.random().toString(36).slice(2);const url=new URL(API);Object.entries(params).forEach(([key,value])=>url.searchParams.set(key,value));url.searchParams.set("callback",callback);const script=document.createElement("script");const timeout=setTimeout(()=>finish(new Error("Request timed out")),30000);function finish(error,data){clearTimeout(timeout);delete window[callback];script.remove();error?reject(error):resolve(data)}window[callback]=(data)=>finish(null,data);script.onerror=()=>finish(new Error("Unable to connect to the payment server"));script.src=url.toString();document.head.appendChild(script)})}
function showLoading(message="Loading..."){isLoading=true;document.body.classList.add("busy");document.getElementById("loadingText").textContent=message;document.getElementById("loadingOverlay").style.display="flex"}
function hideLoading(){isLoading=false;document.body.classList.remove("busy");document.getElementById("loadingOverlay").style.display="none"}
function formatPrice(price,currency){const value=Number(price);return (Number.isInteger(value)?String(value):value.toFixed(2).replace(/0+$/,"").replace(/\.$/,""))+" "+currency}
function openConfirm(locker,card,price,currency){if(isLoading)return;selectedLocker=locker;selectedCard=card;selectedPrice=price;selectedCurrency=currency||"QAR";const label=formatPrice(price,selectedCurrency);document.getElementById("confirmLocker").textContent=locker;document.getElementById("confirmPrice").textContent=label;document.getElementById("payButton").textContent="PAY "+label;document.getElementById("confirmOverlay").style.display="flex"}
function closeConfirm(){document.getElementById("confirmOverlay").style.display="none"}
async function confirmGetPin(){if(isLoading||!selectedLocker||!selectedCard)return;closeConfirm();showLoading("Opening secure payment...");try{const data=await apiRequest({action:"createPayment",locker:selectedLocker});if(!data.success||!data.paymentUrl)throw new Error(data.message||"Unable to create payment.");sessionStorage.setItem("pendingLocker",selectedLocker);window.location.assign(data.paymentUrl)}catch(e){hideLoading();alert(e.message||"Unable to start payment. Please try again.");console.error(e)}}
function updateHoldTimers(){document.querySelectorAll("[data-hold-until]").forEach(element=>{const seconds=Math.max(0,Math.ceil((Number(element.dataset.holdUntil)-Date.now())/1000));const minutes=Math.floor(seconds/60),rest=String(seconds%60).padStart(2,"0");element.textContent=seconds?"PENDING · "+minutes+":"+rest:"Releasing..."})}
async function loadLockers(){if(refreshInProgress||isLoading)return;refreshInProgress=true;try{const lockers=await apiRequest({});const grid=document.getElementById("grid");grid.innerHTML="";lockers.forEach(l=>{const c=document.createElement("div"),status=String(l.status),unavailable=status!=="Free",price=formatPrice(l.price,l.currency);c.className="card"+(status==="Pending"?" pending":status==="Used"?" used":"");if(status==="Pending"){c.innerHTML=`<div class="num">${l.locker}</div><div class="price">${price}</div><div class="hold" data-hold-until="${l.holdUntil||0}"></div>`}else if(status==="Used"){c.innerHTML=`<div class="num">${l.locker}</div><div class="price">${price}</div><div class="usedtxt">USED</div>`}else{c.innerHTML=`<div class="num">${l.locker}</div><div class="price">${price}</div>`;c.onclick=()=>openConfirm(l.locker,c,l.price,l.currency)}grid.appendChild(c)});updateHoldTimers();const splash=document.getElementById("splash");splash.classList.add("hide");setTimeout(()=>splash.style.display="none",400)}catch(e){console.error(e)}finally{refreshInProgress=false}}
async function getPin(locker,card,paymentId){try{const data=await apiRequest({action:"issuePin",locker:locker,paymentId:paymentId});hideLoading();if(!data.success){alert(data.message);loadLockers();return}document.getElementById("popupLocker").textContent=locker;document.getElementById("popupPin").textContent=data.pin;document.getElementById("overlay").style.display="flex";if(card){card.classList.add("used");card.innerHTML+='<div class="usedtxt">USED</div>';card.onclick=null}}catch(e){hideLoading();alert("Connection error. Please try again.");console.error(e)}}
async function completePaymentIfReturned(){const params=new URLSearchParams(window.location.search);const paymentId=params.get("paymentId")||params.get("PaymentId"),locker=params.get("locker")||sessionStorage.getItem("pendingLocker");if(!paymentId||!locker)return;showLoading("Confirming payment...");try{const data=await apiRequest({action:"verifyPayment",paymentId:paymentId,locker:locker});if(!data.success||!data.paid)throw new Error(data.message||"Payment was not completed.");sessionStorage.removeItem("pendingLocker");history.replaceState({},document.title,window.location.pathname);await getPin(locker,null,paymentId)}catch(e){hideLoading();sessionStorage.removeItem("pendingLocker");history.replaceState({},document.title,window.location.pathname);alert(e.message||"We could not confirm your payment. Please contact support if you were charged.");console.error(e)}}
function closePopup(){document.getElementById("overlay").style.display="none";loadLockers()}
completePaymentIfReturned();loadLockers();setInterval(loadLockers,15000);setInterval(updateHoldTimers,1000);
</script>
</body>
</html>
